<svg width="100%" height="100" viewBox="0 0 700 100" xmlns="http://www.w3.org/2000/svg">
  <style>
    /* асновной стиль текста */
    text {
      font-family: monospace;
      font-size: 32px;
      font-weight: 600;
      fill: #ff0000;
      text-anchor: middle;
    }

    /* Скрываем текст перед появлением */
    .line {
      clip-path: inset(0 100% 0 0);
    }

    /* первая страка */
    .line1 {
      animation: line1 18s infinite;
    }

    @keyframes line1 {
      0% { clip-path: inset(0 100% 0 0); }
      7% { clip-path: inset(0 0 0 0); }
      18% { clip-path: inset(0 0 0 0); }
      23% { clip-path: inset(0 100% 0 0); }
      100% { clip-path: inset(0 100% 0 0); }
    }

    /* фтарая */
    .line2 {
      animation: line2 18s infinite;
    }

    @keyframes line2 {
      0%, 24% { clip-path: inset(0 100% 0 0); }
      31% { clip-path: inset(0 0 0 0); }
      42% { clip-path: inset(0 0 0 0); }
      47% { clip-path: inset(0 100% 0 0); }
      100% { clip-path: inset(0 100% 0 0); }
    }

    /* третя */
    .line3 {
      animation: line3 18s infinite;
    }

    @keyframes line3 {
      0%, 48% { clip-path: inset(0 100% 0 0); }
      55% { clip-path: inset(0 0 0 0); }
      66% { clip-path: inset(0 0 0 0); }
      71% { clip-path: inset(0 100% 0 0); }
      100% { clip-path: inset(0 100% 0 0); }
    }

    /* четве */
    .line4 {
      animation: line4 18s infinite;
    }

    @keyframes line4 {
      0%, 72% { clip-path: inset(0 100% 0 0); }
      79% { clip-path: inset(0 0 0 0); }
      91% { clip-path: inset(0 0 0 0); }
      96% { clip-path: inset(0 100% 0 0); }
      100% { clip-path: inset(0 100% 0 0); }
    }
  </style>

  <text class="line line1" x="350" y="60">yøu think i wøuld førget.</text>
  <text class="line line2" x="350" y="60">øh, all that bløød and sweat.</text>
  <text class="line line3" x="350" y="60">yeah, it wasn’t bad før yøu,</text>
  <text class="line line4" x="350" y="60">BUT MY S∅UL PAYS THE DEBT.</text>
</svg>
