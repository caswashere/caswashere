<svg width="100%" height="100" viewBox="0 0 700 100" xmlns="http://www.w3.org/2000/svg"> <style> /* Основной стиль текста */ text { font-family: monospace; font-size: 32px; font-weight: 600; fill: #c9d1d9; /* Центрирование текста */ text-anchor: middle; } /* Скрываем текст перед появлением */ .line { clip-path: inset(0 100% 0 0); } /* ========================= ПЕРВАЯ СТРОКА ========================= */ .line1 { animation: line1 18s infinite; } @keyframes line1 { /* Текст скрыт */ 0% { clip-path: inset(0 100% 0 0); } /* Появление */ 14% { clip-path: inset(0 0 0 0); } /* Некоторое время виден */ 23% { clip-path: inset(0 0 0 0); } /* Исчезновение */ 28% { clip-path: inset(0 100% 0 0); } /* Ожидание нового цикла */ 100% { clip-path: inset(0 100% 0 0); } } /* ========================= ВТОРАЯ СТРОКА ========================= */ .line2 { animation: line2 18s infinite; } @keyframes line2 { /* Скрыт в начале */ 0%, 33% { clip-path: inset(0 100% 0 0); } /* Появление */ 47% { clip-path: inset(0 0 0 0); } /* Остаётся видимым */ 56% { clip-path: inset(0 0 0 0); } /* Исчезновение */ 61% { clip-path: inset(0 100% 0 0); } /* Конец цикла */ 100% { clip-path: inset(0 100% 0 0); } } /* ========================= ТРЕТЬЯ СТРОКА ========================= */ .line3 { animation: line3 18s infinite; } @keyframes line3 { /* Скрыт в начале */ 0%, 66% { clip-path: inset(0 100% 0 0); } /* Появление */ 80% { clip-path: inset(0 0 0 0); } /* Остаётся видимым */ 89% { clip-path: inset(0 0 0 0); } /* Исчезновение */ 94% { clip-path: inset(0 100% 0 0); } /* Конец цикла */ 100% { clip-path: inset(0 100% 0 0); } } </style> <!-- x="350" — середина viewBox (700 / 2) text-anchor="middle" — центрирует текст относительно x --> <text class="line line1" x="350" y="60"> мне нравится то, как ты пытаешься </text> <text class="line line2" x="350" y="60"> изгонять меня еще раз </text> <text class="line line3" x="350" y="60"> ну пожалуйста ;-) </text> </svg>
