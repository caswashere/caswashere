<svg width="700" height="60" viewBox="0 0 700 60"
     xmlns="http://www.w3.org/2000/svg">

  <style>
    text {
      font-family: monospace;
      font-size: 22px;
      fill: #c9d1d9;
    }

    .line {
      clip-path: inset(0 100% 0 0);
    }

    /* 1: 0–5 сек */
    .line1 {
      animation: line1 18s infinite;
    }

    /* 2: 6–10 сек */
    .line2 {
      animation: line2 18s infinite;
    }

    /* 3: 11–15 сек */
    .line3 {
      animation: line3 18s infinite;
    }

    @keyframes line1 {
      0% {
        clip-path: inset(0 100% 0 0);
      }

      14% {
        clip-path: inset(0 0 0 0);
      }

      23% {
        clip-path: inset(0 0 0 0);
      }

      28% {
        clip-path: inset(0 100% 0 0);
      }

      100% {
        clip-path: inset(0 100% 0 0);
      }
    }

    @keyframes line2 {
      0%, 33% {
        clip-path: inset(0 100% 0 0);
      }

      47% {
        clip-path: inset(0 0 0 0);
      }

      56% {
        clip-path: inset(0 0 0 0);
      }

      61% {
        clip-path: inset(0 100% 0 0);
      }

      100% {
        clip-path: inset(0 100% 0 0);
      }
    }

    @keyframes line3 {
      0%, 66% {
        clip-path: inset(0 100% 0 0);
      }

      80% {
        clip-path: inset(0 0 0 0);
      }

      89% {
        clip-path: inset(0 0 0 0);
      }

      94% {
        clip-path: inset(0 100% 0 0);
      }

      100% {
        clip-path: inset(0 100% 0 0);
      }
    }
  </style>

  <text class="line line1" x="10" y="38">
    мне нравится то, как ты пытаешься
  </text>

  <text class="line line2" x="10" y="38">
    изгонять меня еще раз
  </text>

  <text class="line line3" x="10" y="38">
    ну пожалуйста ;-)
  </text>

</svg>
