<svg width="700" height="100" viewBox="0 0 700 100"
     xmlns="http://www.w3.org/2000/svg">

  <style>
    text {
      font-family: monospace;
      font-size: 30px;
      fill: #8B1A1A;
    }

    .line1, .line2 {
      clip-path: inset(0 100% 0 0);
    }

    .line1 {
      animation: first 16s steps(24) infinite;
    }

    .line2 {
      animation: second 16s steps(17) infinite;
    }

    @keyframes first {
      0% {
        clip-path: inset(0 100% 0 0);
      }
      18.75% {
        clip-path: inset(0 0 0 0);
      }
      37.5% {
        clip-path: inset(0 0 0 0);
      }
      50% {
        clip-path: inset(0 100% 0 0);
      }
      100% {
        clip-path: inset(0 100% 0 0);
      }
    }

    @keyframes second {
      0%, 50% {
        clip-path: inset(0 100% 0 0);
      }
      68.75% {
        clip-path: inset(0 0 0 0);
      }
      87.5% {
        clip-path: inset(0 0 0 0);
      }
      100% {
        clip-path: inset(0 100% 0 0);
      }
    }
  </style>

  <text x="50%" y="55%" text-anchor="middle"
        class="line1">sun's bløød øn my hands,</text>

  <text x="50%" y="55%" text-anchor="middle"
        class="line2">i'll tell the møøn</text>

</svg>
