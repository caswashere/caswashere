<svg width="700" height="100" viewBox="0 0 700 100"
     xmlns="http://www.w3.org/2000/svg">

  <style>
    text {
      font-family: monospace;
      font-size: 30px;
      fill: #8B1A1A;
    }

    .line1 {
      clip-path: inset(0 100% 0 0);
      animation: first 9s steps(24, end) infinite;
    }

    .line2 {
      clip-path: inset(0 100% 0 0);
      animation: second 9s steps(17, end) infinite;
    }

    @keyframes first {
      0%   { clip-path: inset(0 100% 0 0); }
      22%  { clip-path: inset(0 0 0 0); }
      38%  { clip-path: inset(0 0 0 0); }
      50%  { clip-path: inset(0 100% 0 0); }
      100% { clip-path: inset(0 100% 0 0); }
    }

    @keyframes second {
      0%, 50% { clip-path: inset(0 100% 0 0); }
      65% { clip-path: inset(0 0 0 0); }
      82% { clip-path: inset(0 0 0 0); }
      94% { clip-path: inset(0 100% 0 0); }
      100% { clip-path: inset(0 100% 0 0); }
    }
  </style>

  <text x="50%" y="55%" text-anchor="middle"
        class="line1">sun's bløød øn my hands,</text>

  <text x="50%" y="55%" text-anchor="middle"
        class="line2">i'll tell the møøn</text>

</svg>
